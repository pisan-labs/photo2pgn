[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Public values only (the anon key is public by design). The owner's
# Anthropic key never goes here: it is used only through the HintWise gateway.
[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://auth.hintwise.org"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE"
  # Free readings: "gateway" (default), "local" (the owner's CLI reader) or
  # "local-then-gateway" (the CLI reader when it is running, else the gateway
  # at once). Owner, 13 Nov: the HintWise reader (halflife) reads everyone's
  # sheets for now; the page does not wait, the game arrives in My games.
  # The privacy page says photos can wait on the server (tests/legal.test.ts).
  VITE_FREE_READER = "local-then-gateway"

[functions]
  node_bundler = "esbuild"

# photo2pgn.hintwise.org/pricing: the app, which opens the credit packs.
[[redirects]]
  from = "/pricing"
  to = "/index.html"
  status = 200

# One address for the app: the netlify.app name sends people to hintwise.org.
[[redirects]]
  from = "https://photo2pgn.netlify.app/*"
  to = "https://photo2pgn.hintwise.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# No Cross-Origin-Opener-Policy: Chess TD opens this site in a tab and sends
# the game back through window.opener, which "same-origin" would cut.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
